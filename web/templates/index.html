<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-less Solver</title>
    <!-- Include HTMX library -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --text-color: #1f2430;
            --muted-text: #5b6474;
            --container-bg: #ffffff;
            --surface-bg: #f8f9fb;
            --border-color: #d8dde6;
            --button-bg: #2563eb;
            --button-hover: #1d4ed8;
            --secondary-bg: #e9edf4;
            --secondary-hover: #dce2ec;
            --secondary-text: #1f2430;
            --grid-bg: #e7ebf2;
            --tile-bg: #fffdf7;
            --tile-border: #d0c8b6;
            --tile-text: #1e232c;
            --tile-shadow: 0 2px 0 rgba(0, 0, 0, 0.14);
            --empty-cell-bg: rgba(0, 0, 0, 0.04);
            --badge-bg: #e8effd;
            --badge-border: #bfd4fb;
            --badge-text: #1e429f;
            --error-bg: #fef2f2;
            --error-border: #fca5a5;
            --error-text: #991b1b;
            --info-bg: #eff6ff;
            --info-border: #93c5fd;
            --info-text: #1e40af;
            --tile-highlight-bg: #fde68a;
            --tile-highlight-border: #d97706;
            --tile-highlight-text: #1e232c;
            --badge-active-bg: #2563eb;
            --badge-active-border: #1d4ed8;
            --badge-active-text: #ffffff;
            --def-bg: #f8f9fb;
            --def-border: #d8dde6;
        }

        .dark-mode {
            --bg-color: #161920;
            --text-color: #e8ecf3;
            --muted-text: #9aa4b6;
            --container-bg: #202530;
            --surface-bg: #272d3b;
            --border-color: #394256;
            --button-bg: #3b82f6;
            --button-hover: #2563eb;
            --secondary-bg: #303748;
            --secondary-hover: #3c4559;
            --secondary-text: #e8ecf3;
            --grid-bg: #181c24;
            --tile-bg: #f2ebd9;
            --tile-border: #c9bfa9;
            --tile-text: #1b1f27;
            --tile-shadow: 0 2px 0 rgba(0, 0, 0, 0.45);
            --empty-cell-bg: rgba(255, 255, 255, 0.04);
            --badge-bg: #25344f;
            --badge-border: #3c5480;
            --badge-text: #bfdbfe;
            --error-bg: #3b1d22;
            --error-border: #993b47;
            --error-text: #fecaca;
            --info-bg: #1e2e46;
            --info-border: #3b6399;
            --info-text: #bfdbfe;
            --tile-highlight-bg: #fcd34d;
            --tile-highlight-border: #f59e0b;
            --tile-highlight-text: #11131a;
            --badge-active-bg: #3b82f6;
            --badge-active-border: #60a5fa;
            --badge-active-text: #ffffff;
            --def-bg: #1b2030;
            --def-border: #343c50;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px 16px 48px;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .page-header h1 {
            margin: 0;
            font-size: 1.7rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin: 2px 0 0;
            font-size: 0.9rem;
            color: var(--muted-text);
        }

        #dark-mode-toggle {
            background: var(--surface-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            padding: 0;
            cursor: pointer;
            flex-shrink: 0;
        }

        #dark-mode-toggle:hover {
            background: var(--secondary-hover);
        }

        .card {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .card h2,
        .card h3 {
            margin: 0;
            font-size: 1.05rem;
        }

        .pill-muted {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--secondary-bg);
            color: var(--muted-text);
            border: 1px solid var(--border-color);
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="number"],
        input[type="file"] {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--container-bg);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        #letters {
            flex: 1 1 240px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .letter-count {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted-text);
            min-width: 48px;
            text-align: center;
        }

        .controls-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .field-compact {
            display: flex;
            flex-direction: column;
        }

        .field-compact input[type="number"] {
            width: 96px;
        }

        button {
            background-color: var(--button-bg);
            color: #ffffff;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background-color 0.15s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--button-hover);
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button.secondary {
            background-color: var(--secondary-bg);
            color: var(--secondary-text);
            border: 1px solid var(--border-color);
        }

        button.secondary:hover:not(:disabled) {
            background-color: var(--secondary-hover);
        }

        .htmx-indicator {
            display: none;
            align-items: center;
            font-size: 0.9rem;
            color: var(--muted-text);
            font-weight: 600;
        }

        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-flex;
        }

        #results-container {
            margin-bottom: 18px;
        }

        .results-placeholder {
            text-align: center;
            padding: 16px;
            border: 1px dashed var(--border-color);
            border-radius: 10px;
            color: var(--muted-text);
            margin: 0;
        }

        .carousel-stage {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin: 12px 0;
        }

        .nav-arrow {
            width: 40px;
            height: 40px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .solution-grid {
            display: inline-flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            background-color: var(--grid-bg);
        }

        .grid-row {
            display: flex;
            gap: 4px;
        }

        .grid-cell {
            width: 36px;
            height: 36px;
            background-color: var(--tile-bg);
            color: var(--tile-text);
            border: 1px solid var(--tile-border);
            border-radius: 6px;
            box-shadow: var(--tile-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 1.05rem;
            text-transform: uppercase;
            user-select: none;
        }

        .grid-cell.empty {
            background-color: var(--empty-cell-bg);
            border-color: transparent;
            box-shadow: none;
        }

        .grid-cell {
            transition: background-color 0.12s ease, border-color 0.12s ease, transform 0.12s ease;
        }

        #result-grid .grid-cell:not(.empty) {
            cursor: pointer;
        }

        .grid-cell.highlighted {
            background-color: var(--tile-highlight-bg);
            border-color: var(--tile-highlight-border);
            color: var(--tile-highlight-text);
            transform: translateY(-2px);
        }

        .results-summary {
            margin: 0 0 8px;
            text-align: center;
            font-size: 0.95rem;
        }

        .results-summary strong {
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .carousel-meta {
            text-align: center;
            font-size: 0.85rem;
            color: var(--muted-text);
            margin-top: 6px;
        }

        .word-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .word-badge,
        button.word-badge {
            background-color: var(--badge-bg);
            border: 1px solid var(--badge-border);
            color: var(--badge-text);
            border-radius: 999px;
            padding: 3px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            font-family: inherit;
        }

        button.word-badge {
            cursor: pointer;
            transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
        }

        button.word-badge:hover,
        button.word-badge:focus-visible,
        button.word-badge.active {
            background-color: var(--badge-active-bg);
            border-color: var(--badge-active-border);
            color: var(--badge-active-text);
            outline: none;
        }

        .definition-box {
            margin-top: 12px;
            padding: 10px 14px;
            background-color: var(--def-bg);
            border: 1px solid var(--def-border);
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.45;
            color: var(--text-color);
            min-height: 1.45em;
            text-align: center;
        }

        .definition-word {
            font-weight: 800;
            letter-spacing: 0.04em;
            margin-right: 6px;
        }

        .definition-hint {
            color: var(--muted-text);
            font-style: italic;
        }

        .error {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 14px;
            border-radius: 8px;
        }

        .info {
            background-color: var(--info-bg);
            border: 1px solid var(--info-border);
            color: var(--info-text);
            padding: 12px 14px;
            border-radius: 8px;
        }

        .error p,
        .info p {
            margin: 4px 0;
        }

        .muted-note {
            margin: 0 0 12px;
            font-size: 0.85rem;
            color: var(--muted-text);
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div>
                <h1>Q-less Solver</h1>
                <p class="subtitle">Arrange all 12 dice into connected 3+ letter words</p>
            </div>
            <button type="button" id="dark-mode-toggle" aria-label="Toggle dark mode">
                🌙
            </button>
        </header>

        <section class="card">
            <div class="card-header">
                <h2>Enter Your 12 Rolled Letters</h2>
                <button type="button" id="roll-dice-btn" class="secondary">Roll 12 Dice</button>
            </div>
            <form id="solver-form"
                  hx-post="/solve-htmx/"
                  hx-target="#results-container"
                  hx-swap="innerHTML"
                  hx-indicator="#loading-indicator">
                <label for="letters">12 rolled letters (no Q):</label>
                <div class="input-row">
                    <input type="text"
                           id="letters"
                           name="letters"
                           maxlength="12"
                           placeholder="e.g. rmtoepngtnxc"
                           autocomplete="off"
                           spellcheck="false"
                           required>
                    <span id="letter-count" class="letter-count">0 / 12</span>
                </div>
                <div class="controls-row">
                    <div class="field-compact">
                        <label for="min_word_length">Min word length</label>
                        <input type="number" id="min_word_length" name="min_word_length" value="3" min="2" max="12">
                    </div>
                    <div class="field-compact">
                        <label for="max_solutions">Max solutions</label>
                        <input type="number" id="max_solutions" name="max_solutions" value="10" min="1" max="50">
                    </div>
                    <button type="submit">Solve</button>
                    <span id="loading-indicator" class="htmx-indicator">Solving...</span>
                </div>
            </form>
        </section>

        <div id="results-container">
            <p class="results-placeholder">Enter 12 letters or roll the dice, then click <strong>Solve</strong>.</p>
        </div>

        <section class="card">
            <div class="card-header">
                <h3>Photo Capture</h3>
                <span class="pill-muted">OCR coming in Phase 4</span>
            </div>
            <p class="muted-note">Upload or take a photo of your dice (automatic letter detection is queued for Phase 4).</p>
            <form id="image-form"
                  hx-post="/solve-image/"
                  hx-target="#results-container"
                  hx-swap="innerHTML"
                  hx-indicator="#loading-indicator"
                  enctype="multipart/form-data">
                <div class="input-row">
                    <input type="file" id="image" name="image" accept="image/*" capture="environment" required>
                </div>
                <div class="controls-row">
                    <div class="field-compact">
                        <label for="img_min_word_length">Min word length</label>
                        <input type="number" id="img_min_word_length" name="min_word_length" value="3" min="2" max="12">
                    </div>
                    <button type="submit" class="secondary">Capture &amp; Solve</button>
                </div>
            </form>
        </section>
    </div>

    <script>
        // Dark mode toggle logic
        const toggleButton = document.getElementById('dark-mode-toggle');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const storedPreference = localStorage.getItem('darkMode');

        function setMode(enabled) {
            document.documentElement.classList.toggle('dark-mode', enabled);
            toggleButton.textContent = enabled ? '☀' : '🌙';
        }

        if (storedPreference === null) {
            setMode(prefersDark.matches);
        } else {
            setMode(storedPreference === 'true');
        }

        toggleButton.addEventListener('click', () => {
            const enabled = !document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('darkMode', enabled);
            setMode(enabled);
        });

        // Manual input counter and Roll 12 Dice helper
        const lettersInput = document.getElementById('letters');
        const letterCount = document.getElementById('letter-count');
        const rollButton = document.getElementById('roll-dice-btn');

        function updateLetterCount() {
            const len = lettersInput.value.trim().length;
            letterCount.textContent = `${len} / 12`;
        }

        lettersInput.addEventListener('input', updateLetterCount);
        updateLetterCount();

        rollButton.addEventListener('click', async () => {
            rollButton.disabled = true;
            try {
                const resp = await fetch('/roll/');
                if (resp.ok) {
                    const data = await resp.json();
                    lettersInput.value = data.letters || '';
                    updateLetterCount();
                }
            } finally {
                rollButton.disabled = false;
            }
        });
    </script>
</body>
</html>
